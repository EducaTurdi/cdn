<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN Painel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; }
        .lock-screen { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 30px; width: 100%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; margin-top: 10%; }
        h2 { margin-top: 0; color: #58a6ff; text-align: center; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #30363d; border-radius: 6px; background-color: #0d1117; color: #c9d1d9; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 10px; background-color: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 5px; }
        button:hover { background-color: #2ea44f; }
        .btn-del { background-color: #da3637; }
        .btn-del:hover { background-color: #b62b2c; }
        .btn-copy { background-color: #21262d; border: 1px solid #30363d; }
        .btn-copy:hover { background-color: #30363d; }
        .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-size: 13px; text-align: center; word-break: break-all; }
        .success { background-color: rgba(56,139,60,0.15); color: #3fb950; border: 1px solid rgba(56,139,60,0.4); }
        .error { background-color: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.4); }
        hr { border: 0; border-top: 1px solid #30363d; margin: 20px 0; }
    </style>
</head>
<body>

<div id="gate" class="lock-screen">
    <h2>SYSTEM LOCKED</h2>
    <div class="field">
        <input type="password" id="pass" placeholder="KEY...">
        <button id="authBtn" style="margin-top: 15px; background-color: #1f6feb;">UNLOCK</button>
    </div>
</div>

<div id="mainApp" class="container">
    <h2>CDN Control Panel</h2>
    <div class="field">
        <label>Upload:</label>
        <input type="file" id="fileInput">
        <button id="upBtn">Upload</button>
    </div>
    <hr>
    <div class="field">
        <label>File:</label>
        <input type="text" id="fileName" placeholder="...">
        <button id="cpBtn" class="btn-copy">Copy</button>
        <button id="delBtn" class="btn-del">Delete</button>
    </div>
    <div id="msg" class="status"></div>
</div>
